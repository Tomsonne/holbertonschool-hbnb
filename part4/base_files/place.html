<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Place Details</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="images/icon.png">
</head>
<body>
    <header>
        <img src="images/logo.png" alt="Logo" class="logo">
        <nav>
            <a href="index.html">Home</a>
            <a href="login.html" id="login-link" class="login-button">Login</a>
        </nav>
    </header>

    <main>
        <section id="place-details" class="place-details">
            <!-- Les détails du lieu seront injectés ici dynamiquement -->
        </section>

        <section id="add-review" style="display: none;">
            <h3>Add a Review</h3>
            <form id="review-form">
                <label for="review-text">Your Review:</label><br>
                <textarea id="review-text" name="text" rows="4" cols="50" required></textarea><br><br>
                <label for="rating">Rating:</label>
                <select id="rating" name="rating" required>
                    <option value="">Select</option>
                    <option value="1">⭐</option>
                    <option value="2">⭐⭐</option>
                    <option value="3">⭐⭐⭐</option>
                    <option value="4">⭐⭐⭐⭐</option>
                    <option value="5">⭐⭐⭐⭐⭐</option>
                </select><br><br>
                <button type="submit">Submit Review</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2025 - All rights reserved.</p>
    </footer>

    <script src="scripts.js"></script>
</body>
</html>
